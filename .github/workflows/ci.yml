name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle/gradle-build-action@v3 已废弃，官方推荐 setup-gradle@v4（含依赖缓存）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --console=plain
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/taskmanager
          DATABASE_USER: postgres
          DATABASE_PASSWORD: secret

      - name: Generate JaCoCo coverage report
        if: always()
        run: ./gradlew jacocoTestReport --console=plain
        continue-on-error: true

      - name: Build fat JAR
        run: ./gradlew jar -x test --console=plain

      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} .

      - name: Smoke test container (health check)
        run: |
          docker run -d --name task-manager -p 8080:8080 task-manager:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live; then echo "healthy"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/metrics/cache || true
          docker logs task-manager
          docker rm -f task-manager

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 7

  docker-image:
    name: Publish Docker image (GHCR)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
