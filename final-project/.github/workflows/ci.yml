name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, unit tests + integration tests
        run: ./gradlew clean test --console=plain --stacktrace
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/library
          DATABASE_USER: library
          DATABASE_PASSWORD: library

      - name: Coverage report
        if: always()
        run: ./gradlew jacocoTestReport --console=plain

      - name: Build fat JAR
        run: ./gradlew jar --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-service-jar
          path: build/libs/library-service.jar
          retention-days: 7

  docker:
    name: Build and smoke-test the container image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t library-service:${{ github.sha }} -t library-service:latest .

      - name: Run container
        run: |
          docker run -d --name library-app -p 8080:8080 library-service:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live; then
              echo "service is up"
              exit 0
            fi
            sleep 3
          done
          echo "service did not start in time"
          docker logs library-app
          exit 1

      - name: Smoke-test the API
        run: |
          set -e
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/metrics | head -20
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$TOKEN"
          curl -fsS http://localhost:8080/api/books -H "Authorization: Bearer $TOKEN"

      - name: Container logs
        if: always()
        run: docker logs library-app || true

      - name: Stop container
        if: always()
        run: docker rm -f library-app || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag library-service:latest ghcr.io/$OWNER:latest
          docker tag library-service:latest ghcr.io/$OWNER:${{ github.sha }}
          docker push ghcr.io/$OWNER:latest
          docker push ghcr.io/$OWNER:${{ github.sha }}
