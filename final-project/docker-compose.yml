services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5433:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-app
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/library
      DATABASE_USER: library
      DATABASE_PASSWORD: library
      JWT_SECRET: library-service-dev-secret-change-me-in-production-0123456789
      JWT_ISSUER: library-service
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  library_pgdata:
